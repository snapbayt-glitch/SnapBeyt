async function smp(){try{return await claude.use('sample')}catch(e){return null}}
async function ask(prompt,out){const s=await smp();if(!s){out.textContent=t('na');return}out.textContent=t('wait');try{await s(SAFE()+'\n\n'+prompt,{modelTier:'quick',cache:false,onText:({text})=>out.textContent=text})}catch(e){out.textContent=e&&e.code==='not_granted'?t('na'):t('err')}}
const RATE={container:[450,700],steel:[600,900],sip:[500,800],panel:[650,1000]};
function drawPlan(sp){const R=(sp.rooms||[]).filter(r=>r.w>0&&r.h>0).map(r=>({n:String(r.n||'').slice(0,18),w:+r.w,h:+r.h}));if(!R.length)return null;
const tot=R.reduce((a,r)=>a+r.w*r.h,0),rw=Math.sqrt(tot)*1.5;let x=0,y=0,rh=0,mx=0,o='';
R.sort((a,b)=>b.w*b.h-a.w*a.h).forEach((r,i)=>{if(x+r.w>rw&&x>0){x=0;y+=rh;rh=0}
o+=`<rect x="${x}" y="${y}" width="${r.w}" height="${r.h}" fill="${i%2?'#38C6F022':'#FFC85722'}" stroke="#8fd3f4" stroke-width=".09"/><text x="${x+r.w/2}" y="${y+r.h/2}" text-anchor="middle" fill="#EAF2FC" font-size=".62">${r.n.replace(/[<&]/g,'')}</text><text x="${x+r.w/2}" y="${y+r.h/2+.8}" text-anchor="middle" fill="#9DB6D3" font-size=".5">${r.w}×${r.h}</text>`;
x+=r.w;mx=Math.max(mx,x);rh=Math.max(rh,r.h)});
return{svg:`<svg viewBox="-.5 -.5 ${mx+1} ${y+rh+1}" role="img">${o}</svg>`,area:tot}}
